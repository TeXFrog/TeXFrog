name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.x"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra \
            texlive-science \
            texlive-extra-utils \
            poppler-utils

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run tests
        run: pytest tests/ -q --tb=short

  latex-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        texlive-version: [2024, 2025, 2026]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install poppler-utils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install TeX Live ${{ matrix.texlive-version }}
        uses: zauguin/install-texlive@v4.4.0
        with:
          texlive_version: ${{ matrix.texlive-version }}
          packages: |
            collection-latex
            collection-latexextra
            collection-latexrecommended
            collection-fontsrecommended
            collection-mathscience
            cryptocode
            pgf
            pdfcrop

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Run LaTeX tests
        run: pytest tests/test_sty_compilation.py tests/test_integration.py -q --tb=short

  wheel-install-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Both artifacts are built and exercised: wheel package-data and sdist
      # contents are governed by different setuptools code paths, so a wheel-only
      # check would not catch a .sty file dropping out of the tarball.
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build -o dist .

      - name: Check both artifacts contain the bundled .sty resources
        run: |
          set -eux
          python - <<'PY'
          import pathlib, tarfile, zipfile

          expected = {"texfrog/resources/texfrog.sty", "texfrog/resources/nicodemus.sty"}
          dist = pathlib.Path("dist")

          wheel = next(dist.glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          missing = expected - names
          assert not missing, f"{wheel.name} is missing {sorted(missing)}"

          sdist = next(dist.glob("*.tar.gz"))
          with tarfile.open(sdist) as tf:
              members = {m.name.split("/", 1)[1]: m for m in tf.getmembers() if "/" in m.name}
          for want in expected:
              m = members.get(want)
              assert m is not None, f"{sdist.name} is missing {want}"
              # texfrog.sty is a symlink in the repo; packaging must dereference
              # it into a real file rather than archiving a dangling link.
              assert m.isfile(), f"{sdist.name}:{want} is not a regular file"
              assert m.size > 1000, f"{sdist.name}:{want} is only {m.size} bytes"
          print("wheel and sdist both contain the bundled .sty resources")
          PY

      - name: Install wheel and sdist into separate clean venvs
        run: |
          set -eux
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --no-binary :all: dist/*.tar.gz

      - name: Scaffold each package profile and assert the files landed
        run: |
          set -eux
          for venv in wheel sdist; do
            for pkg in cryptocode nicodemus algpseudocodex; do
              # Always scaffold into a fresh directory: `texfrog init` skips
              # pre-existing files and still exits 0, which would mask a
              # resource that never got shipped.
              out="$(mktemp -d)/$pkg"
              "/tmp/$venv-venv/bin/texfrog" init "$out" --package "$pkg"

              # Assert the artifacts, not just the exit code.
              test -s "$out/proof.tex"
              test -s "$out/macros.tex"
              test -s "$out/texfrog.sty"
              grep -q 'ProvidesPackage{texfrog}' "$out/texfrog.sty"
              if [ "$pkg" = "nicodemus" ]; then
                test -s "$out/nicodemus.sty"
                grep -q 'ProvidesPackage{nicodemus}' "$out/nicodemus.sty"
              fi
            done
          done

  vscode-extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: vscode-texfrog/package-lock.json

      - name: Install dependencies
        working-directory: vscode-texfrog
        run: npm ci

      - name: Run tests
        working-directory: vscode-texfrog
        run: npm test
